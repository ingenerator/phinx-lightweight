name: Run tests
on:
  push:
    branches:
      # Only mainline branches, features etc are covered on the pull_request trigger
      - '*.x'
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run tests
    services:
      mysql:
        image: mysql:5.7
        ports:
          - 3306
        env:
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: cakephp
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        dependency-versions:
          - 'lowest'
          - 'default'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          tools: composer:v2

      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependency-versions }}

      - name: Verify MySQL connection
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        timeout-minutes: 1
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"$MYSQL_PORT" --silent; do
          sleep 1
          done

      - name: Setup Database
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          n=0
          until [ "$n" -ge 5 ]
          do
            mysql -h 127.0.0.1 -P"$MYSQL_PORT" -u root -proot -e 'CREATE DATABASE phinx;' && break || :
            n=$((n+1))
            sleep 2
          done
          mysql -h 127.0.0.1 -P"$MYSQL_PORT" -u root -proot -D phinx -e 'SELECT 1;'

      - name: Run unit tests
        env:
          MYSQL_DSN: "mysql://root:root@127.0.0.1:${{ job.services.mysql.ports[3306] }}/phinx"
        run: |
          vendor/bin/phpunit
